<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>

        body{
            font-family:Arial;
            background:#f2f2f2;
            text-align:center;
            padding-top:100px;
        }

        .container{
            background:white;
            width:400px;
            margin:auto;
            padding:40px;
            border-radius:15px;
            box-shadow:0px 0px 15px gray;
        }

        h1{
            color:#333;
        }

        button{
            padding:12px 20px;
            margin:10px;
            border:none;
            border-radius:8px;
            background:#007bff;
            color:white;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0056b3;
        }

    </style>
</head>

<body>

<div class="container">

<h1>Welcome to Dashboard</h1>

<a href="{% url 'fill_form' %}">
    <button>Fill Exam Form</button>
</a>

<a href="{% url 'logout' %}">
    <button>Logout</button>
</a>

</div>

</body>
</html>
