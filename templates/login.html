<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body{
            background: linear-gradient(to right, #4facfe, #00f2fe);
            font-family: Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            padding:40px;
            border-radius:15px;
            width:350px;
            box-shadow:0px 0px 15px gray;
            text-align:center;
        }

        h2{
            margin-bottom:20px;
            color:#333;
        }

        button{
            background:#007bff;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:8px;
            cursor:pointer;
            width:100%;
        }

        button:hover{
            background:#0056b3;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Student Login</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
