<!DOCTYPE html>
<html>
<head>
    <title>Exam Form</title>

    <style>

        body{
            background:#eef2f3;
            font-family:Arial;
        }

        .form-box{
            width:450px;
            background:white;
            margin:50px auto;
            padding:40px;
            border-radius:15px;
            box-shadow:0px 0px 15px gray;
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        input, textarea{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border-radius:8px;
            border:1px solid gray;
        }

        button{
            width:100%;
            padding:12px;
            background:#28a745;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#1e7e34;
        }

    </style>
</head>

<body>

<div class="form-box">

<h2>Fill Exam Form</h2>

<form method="post">

    {% csrf_token %}

    <label>Full Name</label>
    <input type="text" name="full_name">

    <label>Course</label>
    <input type="text" name="course">

    <label>Year</label>
    <input type="text" name="year">

    <label>Address</label>
    <textarea name="address"></textarea>

    <label>Phone Number</label>
    <input type="text" name="phone_number">

    <button type="submit">Submit Form</button>

</form>

</div>

</body>
</html>
